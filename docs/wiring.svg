<g font-size="14" fill="#222">
<text x="440.0" y="38" font-size="20" font-weight="bold" text-anchor="middle">Arduino Memory Game: wiring</text>
<text x="0" y="0" transform="translate(140 333) rotate(-90)" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f5f8b">Arduino Uno</text>
<text x="0" y="0" transform="translate(166 333) rotate(-90)" font-size="13" text-anchor="middle" fill="#1f5f8b">ATmega328P, 16 MHz</text>
<text x="248" y="115" text-anchor="end" font-weight="bold">D2</text>
<text x="580" y="115">Button 1 (INT0)</text>
<text x="248" y="153" text-anchor="end" font-weight="bold">D3</text>
<text x="580" y="153">Button 2 (INT1)</text>
<text x="248" y="191" text-anchor="end" font-weight="bold">D4</text>
<text x="580" y="191">Button 3 (PCINT20)</text>
<text x="248" y="229" text-anchor="end" font-weight="bold">D5</text>
<text x="580" y="229">Button 4 (PCINT21)</text>
<text x="248" y="267" text-anchor="end" font-weight="bold">D6</text>
<text x="580" y="267">Green LED (success)</text>
<text x="342" y="250" font-size="11" text-anchor="middle" fill="#555">220 Ω</text>
<text x="248" y="305" text-anchor="end" font-weight="bold">D7</text>
<text x="580" y="305">Yellow LED (input)</text>
<text x="342" y="288" font-size="11" text-anchor="middle" fill="#555">220 Ω</text>
<text x="248" y="343" text-anchor="end" font-weight="bold">D8</text>
<text x="580" y="343">Red LED (mistake)</text>
<text x="342" y="326" font-size="11" text-anchor="middle" fill="#555">220 Ω</text>
<text x="248" y="381" text-anchor="end" font-weight="bold">D9</text>
<text x="580" y="381">Passive buzzer</text>
<text x="420" y="380" font-size="10" text-anchor="middle" font-weight="bold">BZ</text>
<text x="248" y="419" text-anchor="end" font-weight="bold">D10</text>
<text x="580" y="419">LED 1</text>
<text x="342" y="402" font-size="11" text-anchor="middle" fill="#555">220 Ω</text>
<text x="248" y="457" text-anchor="end" font-weight="bold">D11</text>
<text x="580" y="457">LED 2</text>
<text x="342" y="440" font-size="11" text-anchor="middle" fill="#555">220 Ω</text>
<text x="248" y="495" text-anchor="end" font-weight="bold">D12</text>
<text x="580" y="495">LED 3</text>
<text x="342" y="478" font-size="11" text-anchor="middle" fill="#555">220 Ω</text>
<text x="248" y="533" text-anchor="end" font-weight="bold">D13</text>
<text x="580" y="533">LED 4</text>
<text x="342" y="516" font-size="11" text-anchor="middle" fill="#555">220 Ω</text>
<text x="248" y="571" text-anchor="end" font-weight="bold">GND</text>
<text x="580" y="571" font-weight="bold">Common ground</text>
<text x="102" y="533" font-weight="bold">A0</text>
<text x="54" y="553" font-size="11" text-anchor="middle" fill="#555">n/c</text>
<text x="40" y="634" font-size="13" fill="#444">Buttons use the internal pull-up resistors and connect the pin to GND when pressed.</text>
<text x="40" y="652" font-size="13" fill="#444">Each LED has a 220 Ω series resistor. A0 is left floating to seed the random generator.</text>
</g></svg>
